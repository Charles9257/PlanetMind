services:
  postgres:
    image: postgres:16-alpine
    container_name: planetmind-postgres
    environment:
      POSTGRES_USER: planetmind
      POSTGRES_PASSWORD: planetmind
      POSTGRES_DB: planetmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planetmind -d planetmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ./control-plane
    container_name: planetmind-control-plane
    environment:
      DJANGO_SECRET_KEY: planetmind-control-plane-secret-key-2026
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,control-plane
      DJANGO_CORS_ALLOW_ALL: "true"
      DJANGO_DB_ENGINE: postgres
      DJANGO_DB_NAME: planetmind
      DJANGO_DB_USER: planetmind
      DJANGO_DB_PASSWORD: planetmind
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      CONTROL_PLANE_JWT_ISSUER: planetmind-control-plane
      CONTROL_PLANE_JWT_AUDIENCE: planetmind-internal-services
      CONTROL_PLANE_SERVICE_CLIENT_ID: planetmind-backend
      CONTROL_PLANE_SERVICE_CLIENT_SECRET: planetmind-backend-service-secret-2026
      CONTROL_PLANE_SERVICE_USERNAME: svc_planetmind_backend
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/control/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: planetmind-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://planetmind:planetmind@postgres:5432/planetmind
      CONTROL_PLANE_BASE_URL: http://control-plane:8100
      CONTROL_PLANE_ENFORCE_GOVERNANCE: "true"
      CONTROL_PLANE_SYNC_ENABLED: "true"
      CONTROL_PLANE_TIMEOUT_SECONDS: "5"
      CONTROL_PLANE_SERVICE_CLIENT_ID: planetmind-backend
      CONTROL_PLANE_SERVICE_CLIENT_SECRET: planetmind-backend-service-secret-2026
      CONTROL_PLANE_DEFAULT_ORG_ID: "1"

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    container_name: planetmind-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: planetmind-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
      control-plane:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.1
    container_name: planetmind-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
