# Render Blueprint for PlanetMind
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# Render reads this file and provisions all services + the Postgres database.

databases:
  - name: planetmind-postgres
    plan: free
    databaseName: planetmind
    user: planetmind
    ipAllowList: [] # Render-internal only

services:
  # ---------- FastAPI intelligence plane ----------
  - type: web
    name: planetmind-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planetmind-postgres
          property: connectionString
      - key: CONTROL_PLANE_BASE_URL
        value: https://planetmind-control-plane.onrender.com
      - key: CONTROL_PLANE_ENFORCE_GOVERNANCE
        value: "true"
      - key: CONTROL_PLANE_SYNC_ENABLED
        value: "true"
      - key: CONTROL_PLANE_TIMEOUT_SECONDS
        value: "10"
      - key: CONTROL_PLANE_SERVICE_CLIENT_ID
        value: planetmind-backend
      - key: CONTROL_PLANE_SERVICE_CLIENT_SECRET
        sync: false # set manually in Render dashboard (same value as control-plane)
      - key: CONTROL_PLANE_DEFAULT_ORG_ID
        value: "1"

  # ---------- Django control plane ----------
  - type: web
    name: planetmind-control-plane
    runtime: docker
    plan: free
    rootDir: control-plane
    dockerfilePath: ./Dockerfile
    healthCheckPath: /control/health
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: planetmind-control-plane.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://planetmind-control-plane.onrender.com
      - key: DJANGO_CORS_ALLOW_ALL
        value: "true"
      - key: DJANGO_DB_ENGINE
        value: postgres
      - key: DJANGO_DB_NAME
        fromDatabase:
          name: planetmind-postgres
          property: database
      - key: DJANGO_DB_USER
        fromDatabase:
          name: planetmind-postgres
          property: user
      - key: DJANGO_DB_PASSWORD
        fromDatabase:
          name: planetmind-postgres
          property: password
      - key: DJANGO_DB_HOST
        fromDatabase:
          name: planetmind-postgres
          property: host
      - key: DJANGO_DB_PORT
        fromDatabase:
          name: planetmind-postgres
          property: port
      - key: CONTROL_PLANE_JWT_ISSUER
        value: planetmind-control-plane
      - key: CONTROL_PLANE_JWT_AUDIENCE
        value: planetmind-internal-services
      - key: CONTROL_PLANE_SERVICE_CLIENT_ID
        value: planetmind-backend
      - key: CONTROL_PLANE_SERVICE_CLIENT_SECRET
        sync: false # set manually; must match the backend's value
      - key: CONTROL_PLANE_SERVICE_USERNAME
        value: svc_planetmind_backend
      # First-deploy bootstrap: set these once in the dashboard, remove after seeding
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # ---------- React frontend (static site) ----------
  - type: web
    name: planetmind-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://planetmind-backend.onrender.com
      - key: VITE_CONTROL_PLANE_BASE_URL
        value: https://planetmind-control-plane.onrender.com
